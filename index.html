
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Said-AI — Works on Said-AI Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:'Inter',sans-serif;background:#050507;color:#e8e8ea}
.gradient-text{background:linear-gradient(100deg,#60a5fa,#22d3ee 50%,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.frame-glow{box-shadow:0 0 0 1px rgba(255,255,255,0.08),0 20px 60px -15px rgba(59,130,246,0.4)}
.typing span{width:5px;height:5px;background:#666;border-radius:50%;display:inline-block;margin:0 2px;animation:b 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
body{user-select:none;-webkit-user-select:none;-moz-user-select:none}
</style>
</head>
<body class="min-h-screen flex flex-col">

<nav class="h-[64px] border-b border-white/5 flex items-center justify-between px-6 max-w-[1200px] mx-auto w-full">
<div class="flex items-center gap-3"><div class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-500 to-cyan-400 grid place-items-center font-black text-white">S</div><div class="font-bold"><span class="text-white">Said</span><span class="gradient-text">-AI</span></div></div>
<div class="text-[11px] px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-300">● Online • Private • Fast</div>
</nav>

<div class="max-w-[1200px] mx-auto px-6 py-8 grid md:grid-cols-[1.1fr_0.9fr] gap-8 w-full flex-1">
<div class="pt-6">
<h1 class="text-[44px] font-[800] leading-[0.9] tracking-[-0.03em] text-white">Intelligence<br><span class="gradient-text">that works everywhere.</span></h1>
<p class="text-white/50 mt-5 max-w-[420px]">A fast, private AI assistant built by Said. Ask code, ideas, explanations — right here in this frame.</p>
<div class="mt-6 text-[11px] text-white/30 font-mono">Secured • No key in source</div>
</div>

<div class="relative">
<div class="frame-glow bg-[#0e0e10] rounded-[24px] border border-white/10 flex flex-col h-[600px] overflow-hidden">
<div class="h-[44px] bg-[#16161a] border-b border-white/5 flex items-center justify-between px-4">
<div class="flex gap-1.5"><div class="w-3 h-3 rounded-full bg-red-500/80"></div><div class="w-3 h-3 rounded-full bg-yellow-500/80"></div><div class="w-3 h-3 rounded-full bg-green-500/80"></div></div>
<div class="text-[11px] text-white/50">said-ai • direct frame</div><div class="w-6"></div>
</div>
<div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#0e0e10]">
<div id="empty" class="h-full grid place-items-center text-center"><div><div class="w-12 h-12 mx-auto rounded-xl bg-gradient-to-br from-blue-500 to-cyan-400 grid place-items-center font-bold text-white">S</div><div class="text-white/80 text-[14px] mt-3 font-semibold">Said-AI is ready</div><div class="text-white/40 text-[12px] mt-1">Direct mode • Secure</div></div></div>
</div>
<div class="p-3 bg-[#141418] border-t border-white/5">
<div class="flex gap-2 bg-[#1d1d20] border border-white/10 rounded-[12px] px-3 py-2">
<textarea id="input" rows="1" placeholder="Message Said-AI..." class="flex-1 bg-transparent outline-none resize-none text-[14px] text-white placeholder:text-white/30"></textarea>
<button onclick="send()" class="w-8 h-8 rounded-full bg-white text-black grid place-items-center">↑</button>
</div>
</div>
</div>
</div>
</div>

<script>
// ========= SECURE CONFIG - NO KEY HERE =========
const API_URL = "/api/chat";
const API_MODEL = "openai/gpt-4o-mini";
// ==============================================

const chatEl=document.getElementById('chat'), inputEl=document.getElementById('input'), emptyEl=document.getElementById('empty');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function add(t,r){
 if(emptyEl) emptyEl.style.display='none';
 const d=document.createElement('div'); d.className=r==='user'?'flex justify-end':'flex gap-2';
 d.innerHTML=r==='user'?`<div class="bg-white text-black px-3 py-2 rounded-[14px] rounded-br-[4px] max-w-[80%] text-[13px]">${esc(t)}</div>`:`<div class="w-6 h-6 rounded-full bg-white/10 grid place-items-center text-[8px]">AI</div><div class="bg-[#1f1f23] border border-white/5 px-3 py-2 rounded-[14px] rounded-bl-[4px] max-w-[85%] text-[13px] whitespace-pre-wrap">${esc(t)}</div>`;
 chatEl.appendChild(d); chatEl.scrollTop=chatEl.scrollHeight;
}
async function send(){
 const msg=inputEl.value.trim(); if(!msg) return;
 inputEl.value=''; add(msg,'user');
 const th=document.createElement('div'); th.id='th'; th.className='flex gap-2'; th.innerHTML=`<div class="w-6 h-6 rounded-full bg-white/10 grid place-items-center text-[8px]">AI</div><div class="bg-[#1f1f23] px-3 py-2 rounded-[14px]"><div class="typing"><span></span><span></span><span></span></div></div>`;
 chatEl.appendChild(th); chatEl.scrollTop=chatEl.scrollHeight;
 try{
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:API_MODEL,messages:[{role:'user',content:msg}]})});
  const txt=await res.text(); let data; try{data=JSON.parse(txt)}catch{throw new Error(txt.slice(0,400))}
  document.getElementById('th')?.remove();
  if(!res.ok) throw new Error(data.error?.message||JSON.stringify(data).slice(0,300));
  add(data.choices?.[0]?.message?.content||JSON.stringify(data),'ai');
 }catch(e){document.getElementById('th')?.remove(); add('Error: '+e.message,'ai');}
}
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
</script>

<script>
// === No Right Click / Anti view-source (UI deterrent only) ===
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.key === 'F12' || 
      (e.ctrlKey && k === 'u') ||
      (e.ctrlKey && k === 's') ||
      (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(k))) {
    e.preventDefault();
    return false;
  }
});
document.addEventListener('dragstart', e => e.preventDefault());
// extra: disable selection via shortcut
document.addEventListener('copy', e => { /* allow copy of AI answer but not source */ });
</script>

</body>
</html>
