<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    #chat { border: 1px solid #ddd; height: 400px; overflow-y: auto; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
    #input { width: 80%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; }
    button { padding: 12px 20px; border-radius: 8px; border: 0; background: black; color: white; cursor: pointer; }
   .user { font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>My AI Chat</h2>
  <div id="chat"></div>
  <input id="input" placeholder="Type your message..." onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">Send</button>

<script>
async function send() {
  const inputEl = document.getElementById('input');
  const chatEl = document.getElementById('chat');
  const text = inputEl.value.trim();
  if(!text) return;

  chatEl.innerHTML += <div class="user">You: ${text}</div>;
  inputEl.value = 'Thinking...';

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();
  const reply = data.choices?.[0]?.message?.content || JSON.stringify(data);

  chatEl.innerHTML += <div>AI: ${reply}</div>;
  chatEl.scrollTop = chatEl.scrollHeight;
  inputEl.value = '';
}
</script>
</body>
</html>
