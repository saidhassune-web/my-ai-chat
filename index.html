<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My AI Chat</title>
<style>
body{font-family:system-ui;background:#111;color:#fff;max-width:700px;margin:0 auto;padding:20px}
#chat{border:1px solid #333;height:400px;overflow-y:auto;padding:10px;margin-bottom:10px;background:#000}
.msg{margin:8px 0;padding:8px 12px;border-radius:8px;max-width:80%}
.user{background:#2563eb;margin-left:auto}
.ai{background:#222}
#row{display:flex;gap:10px}
input{flex:1;padding:12px;border-radius:8px;border:1px solid #333;background:#222;color:#fff}
button{padding:12px 20px;border-radius:8px;border:0;background:#2563eb;color:#fff;cursor:pointer}
</style>
</head>
<body>
<h2>My AI Chat</h2>
<div id="chat"></div>
<div id="row">
<input id="input" placeholder="Type hello...">
<button onclick="send()">Send</button>
</div>
<script>
const chatDiv=document.getElementById('chat');
const inputEl=document.getElementById('input');
async function send(){
  const message=inputEl.value.trim();
  if(!message) return;
  addMsg(message,'user');
  inputEl.value='';
  addMsg('Thinking...','ai','thinking');
  try{
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message})
    });
    const rawText = await res.text();
    let data;
    try { data = JSON.parse(rawText); } catch { throw new Error(rawText.substring(0,500)); }
    document.getElementById('thinking')?.remove();
    console.log('API response:',data);
    if(!res.ok) throw new Error(data.error || JSON.stringify(data));
    const reply=data.choices?.[0]?.message?.content || JSON.stringify(data);
    addMsg(reply,'ai');
  }catch(e){
    document.getElementById('thinking')?.remove();
    addMsg('ERROR: '+e.message,'ai');
    console.error(e);
  }
}
function addMsg(text,who,id){
  const d=document.createElement('div');
  d.className='msg '+who;
  if(id) d.id=id;
  d.textContent=text;
  chatDiv.appendChild(d);
  chatDiv.scrollTop=chatDiv.scrollHeight;
}
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter') send()});
</script>
</body>
</html>
